name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to fetch main's APK for the size check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Same SDK install as release.yml. Not android-actions/setup-android (broken).
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-25" > /dev/null

      # No secrets: build.sh signs with a throwaway debug key it generates itself.
      - name: Build (warnings are errors)
        env:
          JAVAC_FLAGS: -Xlint:all,-options -Werror
        run: ./build.sh

      - name: MoonPath self-check
        run: java -cp out/classes tv.pane.MoonPath

      - uses: actions/upload-artifact@v7
        with:
          name: pane-apk
          path: pane.apk
          retention-days: 14

      # Fail if the APK grew >15% vs the latest successful run on main. Skipped when there is no baseline yet.
      - name: APK size vs main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ] || ! gh run download "$id" --repo "$GITHUB_REPOSITORY" -n pane-apk -D "$RUNNER_TEMP/base"; then
            echo "No baseline APK on main yet; skipping size check."
            exit 0
          fi
          base=$(stat -c %s "$RUNNER_TEMP/base/pane.apk")
          now=$(stat -c %s pane.apk)
          echo "main: $base bytes, this PR: $now bytes"
          [ $((now * 100)) -le $((base * 115)) ] || { echo "::error::APK grew more than 15% vs main"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Shell scripts (shellcheck)
        run: find . -name '*.sh' -not -path './out/*' -print0 | xargs -0 shellcheck

      - name: Workflows (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Python tools (ruff, asset check)
        run: |
          pip install ruff pillow numpy
          ruff check --select E9,F tools
          python tools/check_assets.py
