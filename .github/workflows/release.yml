name: Release

on:
  push:
    tags: ['v*']
  # Called by auto-release.yml with a tag that does not exist yet (created on publish).
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && github.sha || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner ships the Android SDK; install just what build.sh needs.
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-25" > /dev/null

      - name: Check manifest versionName matches the tag
        run: |
          name="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)"
          if [ "$name" != "${TAG#v}" ]; then
            echo "AndroidManifest versionName ($name) does not match tag $TAG" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section found for [$ver]" >&2
            exit 1
          fi

      - name: Build and sign
        env:
          PANE_KEYSTORE_BASE64: ${{ secrets.PANE_KEYSTORE_BASE64 }}
          PANE_KEYSTORE_PASSWORD: ${{ secrets.PANE_KEYSTORE_PASSWORD }}
          PANE_KEY_ALIAS: ${{ secrets.PANE_KEY_ALIAS }}
          PANE_KEY_PASSWORD: ${{ secrets.PANE_KEY_PASSWORD }}
        run: |
          echo "$PANE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pane.keystore"
          PANE_KEYSTORE="$RUNNER_TEMP/pane.keystore" ./scripts/ci-build.sh
          rm -f "$RUNNER_TEMP/pane.keystore"
          sha256sum pane.apk > pane.apk.sha256
          cat pane.apk.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" pane.apk pane.apk.sha256 \
            --title "Pane $TAG" --notes-file notes.md --target "$GITHUB_SHA" "${pre[@]}"
